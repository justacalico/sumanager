default:
  tags: [linux-truenas]

stages: [test, build, release, deploy]

test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter analyze
    - flutter test --coverage
    - awk '/^SF:lib\/l10n\//{skip=1} /^end_of_record/{if(skip){skip=0;next}} !skip' coverage/lcov.info > coverage/lcov.filtered.info
    - coverage=$(grep -c 'DA:[0-9]*,0$' coverage/lcov.filtered.info || true) && test "$coverage" -eq 0

release:
  stage: release
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  script:
    - cargo install cocogitto --locked
    - cog bump --auto
    - git push --follow-tags origin HEAD:master

build-linux:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter build linux --release
    - tar -czf sumanager-linux-x64.tar.gz -C build/linux/x64/release/bundle .
  artifacts:
    paths: [sumanager-linux-x64.tar.gz]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

flatpak:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter build linux --release
    - ls packaging/flatpak/
  artifacts:
    paths: [packaging/flatpak/]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

pages:
  stage: deploy
  image: alpine:latest
  script:
    - cp -r pages public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
