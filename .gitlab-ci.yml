default:
  tags: [linux-truenas]

stages: [test, release]

test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter analyze
    - flutter test --coverage
    - coverage=$(grep -c 'DA:.*,0' coverage/lcov.info || true) && test "$coverage" -eq 0

release:
  stage: release
  image: rust:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  script:
    - cargo install cocogitto --locked
    - cog bump --auto
    - git push --follow-tags origin HEAD:master
